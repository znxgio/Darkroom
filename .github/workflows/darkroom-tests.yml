name: Darkroom tests

on:
  pull_request:
    branches:
      - claude/ea-fc-sniping-bot-jdz6vq
      - main
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fc-sniper
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install --no-package-lock
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm test
      - name: Run mocked Web App end-to-end tests
        run: npm run e2e
