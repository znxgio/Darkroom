<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darkroom">
<title>Darkroom</title>
<style>
  :root {
    color-scheme: light;
    --workspace: #d6d5d1;      /* neutral gray so it doesn't bias color judgment */
    --text: #1d1c1a;
    --muted: #5d5a54;
    --accent: #3a2a1c;
    --film-base: #3a2a1c;      /* negative-strip orange-brown */
    --edge-print: #e8a33d;     /* amber edge markings */
    --frame-select: #ebe4d2;   /* the TV Set paper border */
    --sheet: rgba(214, 213, 209, 0.97);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --workspace: #1c1c1b;
      --text: #ebe4d2;
      --muted: #9a968c;
      --accent: #ebe4d2;
      --sheet: rgba(28, 28, 27, 0.97);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--workspace);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display: flex; flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--edge-print); outline-offset: 2px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
  .toolbar button { color: var(--accent); font-weight: 600; padding: 6px 2px; }
  .toolbar button[hidden] { display: none; }

  .stage {
    flex: 1; min-height: 0; position: relative;
    display: grid; place-items: center; padding: 8px 12px;
  }
  .stage canvas {
    grid-area: 1 / 1; max-width: 100%; max-height: 100%;
    -webkit-touch-callout: none; touch-action: none;
  }
  .stage canvas[hidden] { display: none; }
  .tag {
    position: absolute; top: 16px; left: 22px;
    font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    background: rgba(0,0,0,.6); color: #ebe4d2;
  }
  .empty { display: grid; justify-items: center; gap: 6px; color: var(--text); text-align: center; }
  .empty svg { width: 44px; height: 44px; margin-bottom: 4px; }
  .empty strong { font-size: 20px; font-weight: 600; }
  .empty span { font-size: 14px; color: var(--muted); }

  .spinner {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: color-mix(in srgb, var(--workspace) 55%, transparent);
  }
  .spinner div {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--muted); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner div { animation-duration: 2.4s; } }

  .controls { padding-top: 14px; }
  .controls[hidden] { display: none; }
  .readout { display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px; }
  .readout strong { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .readout span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: calc(100% - 40px); margin: 10px 20px 14px; accent-color: var(--accent); }

  .strip {
    display: flex; overflow-x: auto; background: var(--film-base);
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .strip::-webkit-scrollbar { display: none; }
  .frame { flex: none; display: grid; justify-items: center; gap: 6px; padding: 6px; }
  .holes { display: flex; gap: 9px; }
  .holes i { width: 9px; height: 6px; border-radius: 1.5px; background: var(--workspace); }
  .frame canvas { width: 72px; height: 72px; display: block; outline: 2px solid transparent; outline-offset: -2px; }
  .frame[aria-pressed=true] canvas { outline-color: var(--frame-select); }
  .frame b { font-size: 11px; font-weight: 600; color: var(--edge-print); white-space: nowrap; }
  .frame[aria-pressed=true] b { color: var(--frame-select); }

  .sheet {
    position: fixed; inset: 0; z-index: 10; background: var(--sheet);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  .sheet[hidden] { display: none; }
  .sheet img { max-width: 100%; max-height: 70dvh; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  .sheet p { margin: 0; color: var(--muted); font-size: 15px; text-align: center; max-width: 34ch; }
  .sheet .row { display: flex; gap: 24px; }
  .sheet a, .sheet button { color: var(--accent); font-weight: 600; text-decoration: none; }
  .notice { position: absolute; left: 20px; right: 20px; bottom: 16px; padding: 10px 14px; border-radius: 10px;
    background: rgba(0,0,0,.75); color: #ebe4d2; font-size: 14px; text-align: center; }
  .error { padding: 20px; text-align: center; color: var(--muted); max-width: 36ch; }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="openBtn" type="button">Open</button>
    <button id="saveBtn" type="button" hidden>Save</button>
  </div>

  <main class="stage" id="stage">
    <button class="empty" id="emptyBtn" type="button">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="7"/>
        <path d="M24 6l6 11M42 24H29.5M33 39l-6-11M15 39l6-11M6 24h12.5M15 9l6 11"/>
      </svg>
      <strong>Open a photo</strong>
      <span>JPEG or HEIC from your library</span>
    </button>
    <canvas id="view" hidden></canvas>
    <canvas id="orig" hidden></canvas>
    <div class="tag" id="origTag" hidden>Original</div>
    <div class="spinner" id="spinner" hidden><div></div></div>
    <div class="notice" id="notice" role="status" hidden></div>
  </main>

  <section class="controls" id="controls" hidden>
    <div class="readout"><strong id="presetName">TV Set</strong><span id="strengthLabel">Strength 100%</span></div>
    <input id="strength" type="range" min="0" max="100" value="100" aria-label="Strength">
    <div class="strip" id="strip" role="group" aria-label="Presets"></div>
  </section>

  <div class="sheet" id="sheet" hidden>
    <img id="sheetImg" alt="Edited photo">
    <p>Press and hold the photo, then tap Save to Photos.</p>
    <div class="row"><a id="downloadLink" download="darkroom.jpg">Download</a><button id="closeSheet" type="button">Done</button></div>
  </div>

  <input id="file" type="file" accept="image/*" hidden>

<script>
/* ---------- Presets ---------- */
const DEFAULTS = {
  exposure: 0, curve: null, contrast: 1, saturation: 1, mix: [1, 1, 1], scale: 1, fade: 0,
  shadowTint: null, shadowAmount: 0, highlightTint: null, highlightAmount: 0,
  halation: 0, softness: 0, grain: 0, grainSize: 1, vignette: 0,
  leak: null, leakStrength: 0, fisheye: 0, border: null
};
const PRESETS = [
  { id: 'tvset', name: 'TV Set', saturation: .78, mix: [1.06, 1.02, .88], scale: .82, fade: 22 / 255,
    softness: .7, grain: .55, grainSize: 3, vignette: .6, leak: 'tr', leakStrength: .35,
    fisheye: .45, border: [235, 228, 210] },
  { id: 'golden', name: 'Golden 400', curve: [[0, .04], [.25, .24], [.5, .52], [.75, .78], [1, .96]],
    contrast: .95, saturation: .92, mix: [1.04, 1, .92], shadowTint: [.35, .5, .45], shadowAmount: .18,
    highlightTint: [1, .82, .6], highlightAmount: .2, halation: .15, grain: .25, grainSize: 1.4, vignette: .25 },
  { id: 'sodium', name: 'Sodium', curve: [[0, .02], [.25, .2], [.5, .5], [.75, .8], [1, .97]],
    contrast: 1.08, saturation: .85, mix: [1.03, .98, .95], shadowTint: [.1, .45, .5], shadowAmount: .35,
    highlightTint: [1, .6, .25], highlightAmount: .3, halation: .45, grain: .3, grainSize: 1.2, vignette: .45 },
  { id: 'coastfog', name: 'Coast Fog', exposure: .1, curve: [[0, .08], [.25, .28], [.5, .52], [.75, .74], [1, .92]],
    contrast: .85, saturation: .6, mix: [.96, 1, 1.04], scale: .9, fade: .07, shadowTint: [.45, .55, .6],
    shadowAmount: .2, softness: .4, grain: .3, grainSize: 1.6, vignette: .2 },
  { id: 'observer', name: 'Observer', contrast: .92, saturation: .7, mix: [.98, 1, 1.03], scale: .94, fade: .05,
    shadowTint: [.3, .4, .5], shadowAmount: .22, highlightTint: [.95, .9, .8], highlightAmount: .12,
    halation: .1, softness: .3, grain: .4, grainSize: 2, vignette: .65 },
  { id: 'expired', name: 'Expired', saturation: .85, mix: [1.08, .97, .94], scale: .9, fade: .06,
    highlightTint: [1, .7, .75], highlightAmount: .18, halation: .2, grain: .45, grainSize: 2.2,
    vignette: .4, leak: 'bl', leakStrength: .45 },
  { id: 'bypass', name: 'Bypass', curve: [[0, 0], [.25, .18], [.5, .5], [.75, .84], [1, 1]],
    contrast: 1.25, saturation: .45, mix: [1, 1.01, 1.03], grain: .35, grainSize: 1.3, vignette: .4 },
  { id: 'silver', name: 'Silver 400', curve: [[0, .02], [.25, .2], [.5, .5], [.75, .8], [1, .98]],
    contrast: 1.15, saturation: 0, grain: .6, grainSize: 1.8, vignette: .35 }
].map(p => ({ ...DEFAULTS, ...p }));

const LEAK_POS = { tl: [0, 1], tr: [1, 1], bl: [0, 0], br: [1, 0] }; // GL uv, y up

/* ---------- WebGL setup ---------- */
const $ = id => document.getElementById(id);
const view = $('view');
const gl = view.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false, alpha: false });

const VS = `attribute vec2 a_pos; varying vec2 v_uv;
void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const FS_GRADE = `precision highp float;
varying vec2 v_uv;
uniform sampler2D u_src, u_lut;
uniform float u_exposure, u_contrast, u_saturation, u_scale, u_fade, u_shadowAmt, u_hiAmt;
uniform vec3 u_mix, u_shadowTint, u_hiTint;
float curve(float x){ return texture2D(u_lut, vec2((clamp(x, 0.0, 1.0) * 255.0 + 0.5) / 256.0, 0.5)).r; }
vec3 softLight(vec3 b, vec3 s){
  vec3 d = mix(sqrt(b), ((16.0 * b - 12.0) * b + 4.0) * b, step(b, vec3(0.25)));
  return mix(b + (2.0 * s - 1.0) * (d - b), b - (1.0 - 2.0 * s) * b * (1.0 - b), step(s, vec3(0.5)));
}
void main(){
  vec3 c = texture2D(u_src, v_uv).rgb * exp2(u_exposure);
  c = vec3(curve(c.r), curve(c.g), curve(c.b));
  float l = dot(c, vec3(0.2125, 0.7154, 0.0721));
  c = mix(vec3(l), c, u_saturation);
  c = clamp((c - 0.5) * u_contrast + 0.5, 0.0, 1.0);
  c = clamp(c * u_mix * u_scale + u_fade, 0.0, 1.0);
  float l2 = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = mix(c, softLight(c, u_shadowTint), (1.0 - l2) * u_shadowAmt);
  c = mix(c, softLight(c, u_hiTint), l2 * u_hiAmt);
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

const FS_BRIGHT = `precision highp float;
varying vec2 v_uv; uniform sampler2D u_src; uniform float u_amount;
void main(){
  vec3 c = texture2D(u_src, v_uv).rgb;
  float h = smoothstep(0.62, 1.0, dot(c, vec3(0.3, 0.6, 0.1)));
  gl_FragColor = vec4(vec3(1.0, 0.35, 0.12) * h * u_amount, 1.0);
}`;

const FS_BLUR = `precision highp float;
varying vec2 v_uv; uniform sampler2D u_src; uniform vec2 u_dir;
void main(){
  vec3 s = texture2D(u_src, v_uv).rgb * 0.2270270270;
  s += (texture2D(u_src, v_uv + u_dir * 1.3846153846).rgb + texture2D(u_src, v_uv - u_dir * 1.3846153846).rgb) * 0.3162162162;
  s += (texture2D(u_src, v_uv + u_dir * 3.2307692308).rgb + texture2D(u_src, v_uv - u_dir * 3.2307692308).rgb) * 0.0702702703;
  gl_FragColor = vec4(s, 1.0);
}`;

const FS_FINAL = `precision highp float;
varying vec2 v_uv;
uniform sampler2D u_orig, u_grade, u_glow;
uniform vec2 u_size, u_outSize, u_leakPos;
uniform vec3 u_paper;
uniform float u_pad, u_soft, u_grain, u_grainSize, u_vignette, u_leakStrength, u_intensity, u_fisheye, u_halation, u_unit;
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
vec3 overlay(vec3 b, vec3 s){ return mix(1.0 - 2.0 * (1.0 - s) * (1.0 - b), 2.0 * s * b, step(b, vec3(0.5))); }
vec3 screen(vec3 a, vec3 b){ return 1.0 - (1.0 - a) * (1.0 - b); }
vec3 grade(vec2 uv){ return texture2D(u_grade, uv).rgb; }
void main(){
  vec2 px = v_uv * u_outSize - vec2(u_pad);
  if (px.x < 0.0 || px.y < 0.0 || px.x > u_size.x || px.y > u_size.y) { gl_FragColor = vec4(u_paper, 1.0); return; }
  vec2 uv = px / u_size;
  if (u_fisheye > 0.0) {
    vec2 c = (uv - 0.5) * u_size;
    float R = max(u_size.x, u_size.y) * 0.75;
    float f = 1.0 - u_fisheye * 0.6 * (1.0 - smoothstep(0.0, R, length(c)));
    uv = clamp(c * f / u_size + 0.5, 0.0, 1.0);
  }
  vec3 g;
  if (u_soft > 0.0) {
    vec2 t = u_soft * u_unit / u_size;
    g = grade(uv) * 0.25
      + (grade(uv + vec2(t.x, 0.0)) + grade(uv - vec2(t.x, 0.0)) + grade(uv + vec2(0.0, t.y)) + grade(uv - vec2(0.0, t.y))) * 0.125
      + (grade(uv + t) + grade(uv - t) + grade(uv + vec2(t.x, -t.y)) + grade(uv + vec2(-t.x, t.y))) * 0.0625;
  } else {
    g = grade(uv);
  }
  if (u_halation > 0.0) g = screen(g, texture2D(u_glow, uv).rgb);
  if (u_grain > 0.0) {
    float s = max(1.0, u_grainSize * u_unit);
    vec2 gp = floor(px) / s + 17.0;
    float n = s > 1.01 ? (vnoise(gp) - 0.5) * 1.7 + 0.5 : hash(gp);
    g = overlay(g, vec3(0.5 + (n - 0.5) * u_grain * 0.5));
  }
  if (u_vignette > 0.0) {
    float dn = length(px - u_size * 0.5) / (0.5 * length(u_size));
    g *= 1.0 - u_vignette * smoothstep(0.4, 1.05, dn);
  }
  if (u_leakStrength > 0.0) {
    float d = length(px - u_leakPos * u_size) / (max(u_size.x, u_size.y) * 0.7);
    g = screen(g, vec3(1.0, 0.42, 0.12) * u_leakStrength * max(0.0, 1.0 - d));
  }
  gl_FragColor = vec4(mix(texture2D(u_orig, uv).rgb, clamp(g, 0.0, 1.0), u_intensity), 1.0);
}`;

function makeProgram(fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.bindAttribLocation(p, 0, 'a_pos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return { p, locs: {} };
}
function use(prog, uniforms, textures) {
  gl.useProgram(prog.p);
  const loc = n => (n in prog.locs) ? prog.locs[n] : (prog.locs[n] = gl.getUniformLocation(prog.p, n));
  for (const [n, v] of Object.entries(uniforms)) {
    const l = loc(n); if (l === null) continue;
    if (typeof v === 'number') gl.uniform1f(l, v);
    else if (v.length === 2) gl.uniform2fv(l, v);
    else gl.uniform3fv(l, v);
  }
  textures.forEach(([n, tex], i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex);
    const l = loc(n); if (l !== null) gl.uniform1i(l, i);
  });
}
function makeTex(w, h, source) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (source) {
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  } else {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  }
  return t;
}
function makeTarget(w, h) {
  const tex = makeTex(w, h);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h };
}
function drawTo(target, w, h) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, w, h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* Smooth monotone curve through the preset's points → 256-entry lookup texture */
const lutCache = {};
function lutFor(p) {
  if (lutCache[p.id]) return lutCache[p.id];
  const data = new Uint8Array(256 * 4);
  const pts = p.curve;
  for (let k = 0; k < 256; k++) {
    let y = k / 255;
    if (pts) {
      const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]), n = pts.length;
      const d = [], m = [];
      for (let i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
      m[0] = d[0]; m[n - 1] = d[n - 2];
      for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
      const x = k / 255; let i = 0;
      while (i < n - 2 && x > xs[i + 1]) i++;
      const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
      y = (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
    }
    const v = Math.round(Math.min(1, Math.max(0, y)) * 255);
    data.set([v, v, v, 255], k * 4);
  }
  const t = makeTex(256, 1);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  return (lutCache[p.id] = t);
}

/* A "source" is an uploaded photo plus its working buffers */
function makeSource(canvas) {
  const w = canvas.width, h = canvas.height;
  const qw = Math.max(1, Math.round(w / 4)), qh = Math.max(1, Math.round(h / 4));
  return { w, h, tex: makeTex(w, h, canvas), grade: makeTarget(w, h), glowA: makeTarget(qw, qh), glowB: makeTarget(qw, qh) };
}
function freeSource(s) {
  if (!s) return;
  gl.deleteTexture(s.tex);
  for (const t of [s.grade, s.glowA, s.glowB]) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }
}

let progGrade, progBright, progBlur, progFinal;

function render(src, p, intensity) {
  const { w, h } = src;
  const unit = Math.max(w, h) / 2000; // keeps grain/blur the same size at any resolution

  use(progGrade, {
    u_exposure: p.exposure, u_contrast: p.contrast, u_saturation: p.saturation, u_scale: p.scale, u_fade: p.fade,
    u_mix: p.mix, u_shadowTint: p.shadowTint || [.5, .5, .5], u_shadowAmt: p.shadowTint ? p.shadowAmount : 0,
    u_hiTint: p.highlightTint || [.5, .5, .5], u_hiAmt: p.highlightTint ? p.highlightAmount : 0
  }, [['u_src', src.tex], ['u_lut', lutFor(p)]]);
  drawTo(src.grade, w, h);

  if (p.halation > 0) {
    const { w: qw, h: qh } = src.glowA;
    use(progBright, { u_amount: p.halation }, [['u_src', src.grade.tex]]);
    drawTo(src.glowA, qw, qh);
    const spread = Math.max(1, 1.6 * unit);
    for (let pass = 0; pass < 2; pass++) {
      use(progBlur, { u_dir: [spread / qw, 0] }, [['u_src', src.glowA.tex]]); drawTo(src.glowB, qw, qh);
      use(progBlur, { u_dir: [0, spread / qh] }, [['u_src', src.glowB.tex]]); drawTo(src.glowA, qw, qh);
    }
  }

  const pad = p.border ? Math.round(Math.min(w, h) * 0.04) : 0;
  const ow = w + 2 * pad, oh = h + 2 * pad;
  if (view.width !== ow) view.width = ow;
  if (view.height !== oh) view.height = oh;

  use(progFinal, {
    u_size: [w, h], u_outSize: [ow, oh], u_pad: pad,
    u_paper: p.border ? p.border.map(v => v / 255) : [1, 1, 1],
    u_soft: p.softness, u_grain: p.grain, u_grainSize: p.grainSize, u_vignette: p.vignette,
    u_leakPos: LEAK_POS[p.leak] || [1, 1], u_leakStrength: p.leak ? p.leakStrength : 0,
    u_intensity: intensity, u_fisheye: p.fisheye, u_halation: p.halation, u_unit: unit
  }, [['u_orig', src.tex], ['u_grade', src.grade.tex], ['u_glow', src.glowA.tex]]);
  drawTo(null, ow, oh);
  return gl.drawingBufferWidth === ow && gl.drawingBufferHeight === oh;
}

/* ---------- App state ---------- */
let photo = null, previewSrc = null, current = PRESETS[0], intensity = 1;
const frames = {};

/* Tries three ways to decode a photo, since iPhone files (HEIC) and the Claude app's
   sandbox each block a different route. Returns an <img> or an ImageBitmap. */
function loadImg(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const timer = setTimeout(() => reject(new Error('timeout')), 20000);
    img.onload = () => { clearTimeout(timer); resolve(img); };
    img.onerror = () => { clearTimeout(timer); reject(new Error('failed')); };
    img.src = src;
  });
}
const readDataURL = f => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result);
  r.onerror = () => reject(new Error('failed'));
  r.readAsDataURL(f);
});
async function decodeFile(file) {
  const errors = [];
  try { return await loadImg(URL.createObjectURL(file)); } catch (e) { errors.push('blob ' + e.message); }
  try { return await loadImg(await readDataURL(file)); } catch (e) { errors.push('data ' + e.message); }
  try { return await createImageBitmap(file); } catch (e) { errors.push('bitmap ' + (e.message || e.name)); }
  throw new Error(errors.join(', '));
}

function scaledCanvas(img, maxDim, maxArea, square) {
  let sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height, sx = 0, sy = 0;
  if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
  let k = Math.min(1, maxDim / Math.max(sw, sh));
  if (maxArea) k = Math.min(k, Math.sqrt(maxArea / (sw * sh)));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

let noticeTimer;
function notify(msg) {
  const n = $('notice'); n.textContent = msg; n.hidden = false;
  clearTimeout(noticeTimer); noticeTimer = setTimeout(() => { n.hidden = true; }, 6000);
}
const busy = on => { $('spinner').hidden = !on; $('saveBtn').disabled = on; };
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

function buildStrip() {
  const strip = $('strip');
  for (const p of PRESETS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'frame'; b.setAttribute('aria-pressed', p === current);
    b.innerHTML = '<span class="holes"><i></i><i></i><i></i><i></i></span><canvas width="144" height="144"></canvas><b></b><span class="holes"><i></i><i></i><i></i><i></i></span>';
    b.querySelector('b').textContent = p.name;
    b.setAttribute('aria-label', p.name);
    b.addEventListener('click', () => select(p));
    strip.appendChild(b);
    frames[p.id] = b;
  }
}

function select(p) {
  current = p;
  for (const q of PRESETS) frames[q.id].setAttribute('aria-pressed', q === p);
  $('presetName').textContent = p.name;
  renderPreview();
}

let pending = false;
function renderPreview() {
  if (!previewSrc || pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(previewSrc, current, intensity); });
}

async function openFile(file) {
  if (!file) return;
  busy(true);
  try {
    const img = await decodeFile(file);
    if (photo && photo.src && photo.src.startsWith('blob:')) URL.revokeObjectURL(photo.src);
    photo = img;

    // Thumbnails
    const thumb = makeSource(scaledCanvas(img, 160, 0, true));
    for (const p of PRESETS) {
      render(thumb, p, 1);
      frames[p.id].querySelector('canvas').getContext('2d').drawImage(view, 0, 0, 144, 144);
    }
    freeSource(thumb);

    // Preview + original for press-and-hold comparison
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const base = scaledCanvas(img, Math.round(Math.max(innerWidth, innerHeight) * dpr * 0.9), 0, false);
    const orig = $('orig');
    orig.width = base.width; orig.height = base.height;
    orig.getContext('2d').drawImage(base, 0, 0);
    freeSource(previewSrc);
    previewSrc = makeSource(base);

    $('emptyBtn').hidden = true;
    view.hidden = false;
    $('controls').hidden = false;
    $('saveBtn').hidden = false;
    render(previewSrc, current, intensity);
  } catch (e) {
    notify('That photo couldn\u2019t be opened. Details: ' + e.message + ' | ' + (file.type || 'unknown type') + ', ' + (file.size / 1e6).toFixed(1) + ' MB');
  } finally {
    busy(false);
    $('file').value = '';
  }
}

async function save() {
  if (!photo) return;
  busy(true);
  await nextFrame();
  let blob = null, src = null;
  try {
    const maxTex = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0]);
    let area = 12e6; // iPhone Safari's canvas memory ceiling sits around 16 MP
    for (let attempt = 0; attempt < 4 && !blob; attempt++, area *= 0.6) {
      const borderRoom = current.border ? 0.92 : 1;
      src = makeSource(scaledCanvas(photo, Math.floor(maxTex * borderRoom), area * borderRoom * borderRoom, false));
      if (render(src, current, intensity)) {
        blob = await new Promise(r => view.toBlob(r, 'image/jpeg', 0.95));
      }
      freeSource(src); src = null;
    }
  } catch (e) { /* falls through to the error below */ }
  render(previewSrc, current, intensity);
  busy(false);
  if (!blob) { notify('The full-size render failed. Close other tabs and try again.'); return; }
  deliver(blob);
}

async function deliver(blob) {
  const file = new File([blob], `darkroom-${current.id}-${Date.now()}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  $('sheetImg').src = url;
  $('downloadLink').href = url;
  $('downloadLink').download = file.name;
  $('sheet').hidden = false;
}

/* ---------- Wiring ---------- */
function init() {
  if (!gl) {
    $('stage').innerHTML = '<p class="error">This browser can\u2019t run Darkroom because WebGL is turned off or unavailable.</p>';
    $('openBtn').hidden = true;
    return;
  }
  progGrade = makeProgram(FS_GRADE);
  progBright = makeProgram(FS_BRIGHT);
  progBlur = makeProgram(FS_BLUR);
  progFinal = makeProgram(FS_FINAL);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  buildStrip();
  const pick = () => $('file').click();
  $('openBtn').addEventListener('click', pick);
  $('emptyBtn').addEventListener('click', pick);
  $('file').addEventListener('change', e => openFile(e.target.files[0]));
  $('saveBtn').addEventListener('click', save);
  $('closeSheet').addEventListener('click', () => {
    $('sheet').hidden = true;
    URL.revokeObjectURL($('sheetImg').src);
  });
  $('strength').addEventListener('input', e => {
    intensity = e.target.value / 100;
    $('strengthLabel').textContent = `Strength ${e.target.value}%`;
    renderPreview();
  });

  // Press and hold the photo to compare with the original
  const showOrig = on => { if (!previewSrc) return; $('orig').hidden = !on; view.hidden = on; $('origTag').hidden = !on; };
  view.addEventListener('pointerdown', () => showOrig(true));
  $('orig').addEventListener('pointerup', () => showOrig(false));
  $('orig').addEventListener('pointercancel', () => showOrig(false));
  $('orig').addEventListener('pointerleave', () => showOrig(false));
  window.addEventListener('pointerup', () => showOrig(false));
}
try { init(); } catch (e) {
  $('stage').innerHTML = '<p class="error">Darkroom couldn\u2019t start: ' + e.message + '</p>';
}
</script>
</body>
</html>
